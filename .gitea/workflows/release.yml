name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    name: Build, Bundle, & Release
    runs-on: ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.5

      - name: Install Dependencies
        run: bun ci

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
          token: ${{ secrets.GH_AUTH }}

      - name: Install Rokit Dependencies
        run: rokit install --no-trust-check

      - name: ESLint Check
        run: bun run lint

      - name: Build & Bundle
        run: bun run build

      - name: Get Version
        uses: saionaro/extract-package-version@v1.3.0
        id: version

      - name: Release
        uses: akkuman/gitea-release-action@v1.3.5
        with:
          server_url: ${{ env.INTERNAL_SERVER_URL }}
          token: ${{ secrets.AUTH }}
          body: "Automated release: script(s) should be attached: 📜"
          name: 📦 Release ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          files: "out/*.luau"
